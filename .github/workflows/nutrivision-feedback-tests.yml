name: NutriVision release checks

on:
  push:
    paths:
      - "NutriVision-AI/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"
  pull_request:
    paths:
      - "NutriVision-AI/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"

defaults:
  run:
    working-directory: NutriVision-AI

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate submission and historical training notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          
          auxiliary = {"API_Client_Demo.ipynb", "Automatic_Nutrition_Comparison.ipynb"}
          original = Path("training/Original_NutriVision_Research.ipynb")
          extracts = {
              "ConvNeXt_Food101_Training.ipynb": [64, 65, 66],
              "DINOv2_Food101_Training.ipynb": [68, 69, 70, 74, 75, 76, 98, 99],
              "Nutrition_MLP_Training.ipynb": [112, 113, 114],
          }
          assert {p.name for p in Path("notebooks").glob("*.ipynb")} == auxiliary
          assert {p.name for p in Path("training").glob("*.ipynb")} == set(extracts) | {original.name}
          assert Path("training/FoodPresence_V2_Training_Source.py").is_file()
          assert Path("training/README.md").is_file()
          
          def load_clean(path):
              nb = json.loads(path.read_text(encoding="utf-8"))
              assert nb["nbformat"] == 4, path
              code = [c for c in nb["cells"] if c["cell_type"] == "code"]
              assert code and all(not c.get("outputs") and c.get("execution_count") is None for c in code), path
              return code
          
          for filename in auxiliary:
              load_clean(Path("notebooks") / filename)
          source = load_clean(original)
          assert len(source) == 133
          assert [c.get("metadata", {}).get("original_cell_index_zero_based") for c in source] == list(range(133))
          for name, indices in extracts.items():
              code = load_clean(Path("training") / name)
              mapped = [
                  c for c in code
                  if "original_cell_index_zero_based" in c.get("metadata", {})
              ]
              assert [c["metadata"]["original_cell_index_zero_based"] for c in mapped] == indices, name
              for cell in mapped:
                  original_cell = source[cell["metadata"]["original_cell_index_zero_based"]]
                  assert cell["source"] == original_cell["source"], name
          print("All release notebooks are clean and all 147 original training cells match.")
          PY
      - name: Syntax check standalone V2 training source
        run: python -m py_compile training/FoodPresence_V2_Training_Source.py
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: "2"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriVision-AI/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
