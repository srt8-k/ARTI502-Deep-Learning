name: NutriVision feedback unit tests

on:
  push:
    paths:
      - "NutriVision-AI/backend/feedback_store.py"
      - "NutriVision-AI/tests/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"
  pull_request:
    paths:
      - "NutriVision-AI/backend/feedback_store.py"
      - "NutriVision-AI/tests/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"

jobs:
  feedback-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install fastapi pytest
      - name: Run feedback tests
        working-directory: NutriVision-AI
        run: python -m pytest tests -q
