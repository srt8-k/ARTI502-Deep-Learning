name: NutriVision release checks

on:
  push:
    paths:
      - "NutriVision-AI/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"
  pull_request:
    paths:
      - "NutriVision-AI/**"
      - ".github/workflows/nutrivision-feedback-tests.yml"

defaults:
  run:
    working-directory: NutriVision-AI

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate submission notebooks
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path("notebooks").glob("*.ipynb"))
          assert [p.name for p in paths] == ["API_Client_Demo.ipynb", "Automatic_Nutrition_Comparison.ipynb"]
          for path in paths:
              nb = json.loads(path.read_text(encoding="utf-8"))
              assert nb["nbformat"] == 4
              cells = [c for c in nb["cells"] if c["cell_type"] == "code"]
              assert cells and all(not c.get("outputs") and c.get("execution_count") is None for c in cells)
          PY
      - run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          OMP_NUM_THREADS: "2"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriVision-AI/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
